<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleway — Onboarding</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#0a0a0b; --surface:#141416; --surface-2:#1c1c20; --border:#2a2a30; --text:#e8e8ec; --text-muted:#7a7a85; --accent:#e8e8ec; --accent-dim:#e8e8ec15; --ai-bg:#16161a; --user-bg:#1e1e24; --danger:#ef4444; --success:#22c55e; --radius:12px; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }

    /* ── Login Screen ── */
    .login-screen { display:flex; align-items:center; justify-content:center; flex:1; padding:24px; }
    .login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:48px; max-width:420px; width:100%; text-align:center; }
    .login-box .logo-icon { width:48px; height:48px; background:var(--accent); border-radius:12px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:20px; color:#000; margin-bottom:16px; }
    .login-box h1 { font-size:24px; font-weight:600; margin-bottom:8px; letter-spacing:-0.02em; }
    .login-box h1 span { color:var(--accent); }
    .login-box p { color:var(--text-muted); font-size:14px; margin-bottom:32px; line-height:1.5; }
    .login-box input[type="email"] { width:100%; font-family:'DM Sans',sans-serif; font-size:15px; padding:14px 18px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-2); color:var(--text); margin-bottom:16px; transition:border-color .2s; }
    .login-box input:focus { outline:none; border-color:var(--accent); }
    .login-box input::placeholder { color:var(--text-muted); }
    .btn-login { width:100%; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:600; padding:14px; border-radius:var(--radius); border:none; background:var(--accent); color:#000; cursor:pointer; transition:filter .2s; }
    .btn-login:hover { filter:brightness(1.1); }
    .btn-login:disabled { opacity:.4; cursor:not-allowed; }

    /* ── Resume Modal ── */
    .resume-modal { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius); padding:20px; margin-top:20px; text-align:left; }
    .resume-modal p { color:var(--text); font-size:14px; margin-bottom:12px; }
    .resume-modal .btns { display:flex; gap:10px; }
    .resume-modal .btn-sm { flex:1; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:600; padding:10px; border-radius:8px; border:none; cursor:pointer; transition:filter .2s; }
    .btn-resume { background:var(--accent); color:#000; }
    .btn-new { background:var(--surface); color:var(--text); border:1px solid var(--border) !important; }

    /* ── Header ── */
    header { padding:14px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--surface); flex-shrink:0; }
    .logo { display:flex; align-items:center; gap:10px; }
    .logo-sm { width:28px; height:28px; background:var(--accent); border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; color:#000; }
    .logo h1 { font-size:16px; font-weight:600; } .logo h1 span { color:var(--accent); }
    .header-right { display:flex; align-items:center; gap:12px; }
    .pill { font-family:'JetBrains Mono',monospace; font-size:11px; padding:4px 10px; border-radius:20px; background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
    .btn-icon { background:transparent; color:var(--text-muted); border:1px solid var(--border); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px; transition:all .2s; font-family:'DM Sans',sans-serif; }
    .btn-icon:hover { color:var(--danger); border-color:var(--danger); }

    /* ── Chat ── */
    .chat-container { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth; }
    .chat-container::-webkit-scrollbar { width:5px; } .chat-container::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
    .message { max-width:720px; padding:12px 16px; border-radius:var(--radius); line-height:1.6; font-size:15px; animation:fadeIn .3s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .message.ai { background:var(--ai-bg); border:1px solid var(--border); align-self:flex-start; }
    .message.user { background:var(--user-bg); border:1px solid var(--border); align-self:flex-end; }
    .message .label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-bottom:4px; display:block; }
    .message.ai .label { color:var(--accent); } .message.user .label { color:var(--text-muted); }
    .message .tnote { font-size:11px; color:var(--text-muted); font-style:italic; margin-bottom:4px; }
    .message .content { white-space:pre-wrap; }
    .typing { display:flex; gap:4px; padding:14px 18px; align-self:flex-start; }
    .typing span { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:bounce 1.4s infinite; }
    .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-5px);opacity:1} }
    .finished-banner { text-align:center; padding:20px; animation:fadeIn .5s; }
    .finished-banner a { color:var(--accent); text-decoration:none; font-weight:600; font-size:16px; }
    .finished-banner a:hover { text-decoration:underline; }

    /* ── Input ── */
    .input-area { padding:14px 24px 20px; border-top:1px solid var(--border); background:var(--surface); flex-shrink:0; }
    .input-wrap { display:flex; gap:8px; align-items:flex-end; max-width:800px; margin:0 auto; }
    textarea { flex:1; font-family:'DM Sans',sans-serif; font-size:15px; padding:12px 16px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface-2); color:var(--text); resize:none; min-height:48px; max-height:120px; line-height:1.5; transition:border-color .2s; }
    textarea:focus { outline:none; border-color:var(--accent); } textarea::placeholder { color:var(--text-muted); }
    .btn { font-family:'DM Sans',sans-serif; font-size:14px; font-weight:600; padding:12px 16px; border-radius:var(--radius); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all .2s; height:48px; min-width:48px; }
    .btn-send { background:var(--accent); color:#000; } .btn-send:hover{filter:brightness(1.1)} .btn-send:disabled{opacity:.4;cursor:not-allowed}
    .btn-mic { background:var(--surface-2); color:var(--text); border:1px solid var(--border); } .btn-mic:hover{border-color:var(--accent);color:var(--accent)}
    .btn-mic.recording { background:var(--danger); color:white; border-color:var(--danger); animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)} 50%{box-shadow:0 0 0 8px rgba(239,68,68,0)} }
    .input-footer { display:flex; justify-content:space-between; align-items:center; margin-top:6px; max-width:800px; margin-left:auto; margin-right:auto; }
    .hint { font-size:11px; color:var(--text-muted); }
    .rec-timer { font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--danger); display:none; } .rec-timer.on{display:inline}
    .btn-finish { background:transparent; color:var(--text-muted); border:1px solid var(--border); font-size:12px; padding:6px 12px; height:auto; border-radius:8px; font-family:'DM Sans',sans-serif; cursor:pointer; } .btn-finish:hover{color:var(--accent);border-color:var(--accent)}

    .hidden { display:none !important; }
    @media(max-width:640px) { header{padding:10px 16px} .chat-container{padding:16px} .input-area{padding:10px 16px 16px} .message{max-width:100%;font-size:14px} .login-box{padding:32px 24px} }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-box">
      <div style="margin-bottom:16px"><svg width="48" height="42" viewBox="0 0 52 44" fill="none"><path d="M0 22L20 8L26 22L20 36Z" fill="#e8e8ec"/><path d="M26 22L20 8L52 4Z" fill="#e8e8ec"/><path d="M26 22L20 36L44 40Z" fill="#e8e8ec" opacity="0.45"/></svg></div>
      <h1>fleway</h1>
      <p>Vamos construir seu perfil estratégico de criador.<br>Leva ~15 minutos. Pode usar texto ou áudio.</p>
      <input type="email" id="emailInput" placeholder="Seu email" autocomplete="email">
      <button class="btn-login" id="btnLogin">Começar</button>
      <div class="resume-modal hidden" id="resumeModal">
        <p>Você tem uma entrevista em andamento (<span id="resumeTurns">0</span> turnos). Quer continuar?</p>
        <div class="btns">
          <button class="btn-sm btn-resume" id="btnResume">Continuar</button>
          <button class="btn-sm btn-new" id="btnNewSession">Começar do zero</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT -->
  <div id="chatScreen" class="hidden" style="display:flex;flex-direction:column;height:100vh;">
    <header>
      <div class="logo"><svg width="22" height="19" viewBox="0 0 52 44" fill="none"><path d="M0 22L20 8L26 22L20 36Z" fill="#e8e8ec"/><path d="M26 22L20 8L52 4Z" fill="#e8e8ec"/><path d="M26 22L20 36L44 40Z" fill="#e8e8ec" opacity="0.45"/></svg><h1>fleway</h1></div>
      <div class="header-right">
        <span class="pill" id="statusPill">Turno 0</span>
        <button class="btn-icon" id="btnReset">↻ Reiniciar</button>
      </div>
    </header>
    <div class="chat-container" id="chat"></div>
    <div class="input-area" id="inputArea">
      <div class="input-wrap">
        <textarea id="msgInput" placeholder="Digite ou use o microfone..." rows="1"></textarea>
        <button class="btn btn-mic" id="btnMic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
        <button class="btn btn-send" id="btnSend"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
      <div class="input-footer">
        <span class="hint">Enter para enviar · Shift+Enter nova linha</span>
        <span class="rec-timer" id="recTimer">● REC 0:00</span>
        <button class="btn-finish" id="btnFinish">Encerrar e salvar</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let creatorId = null, sessionId = null, isWaiting = false, isRecording = false;
    let mediaRecorder = null, audioChunks = [], recStart = null, recInterval = null;

    // Elements
    const $ = id => document.getElementById(id);
    const loginScreen=$("loginScreen"), chatScreen=$("chatScreen"), emailInput=$("emailInput");
    const btnLogin=$("btnLogin"), resumeModal=$("resumeModal"), resumeTurns=$("resumeTurns");
    const btnResume=$("btnResume"), btnNewSession=$("btnNewSession");
    const chat=$("chat"), msgInput=$("msgInput"), btnSend=$("btnSend"), btnMic=$("btnMic");
    const btnFinish=$("btnFinish"), btnReset=$("btnReset"), statusPill=$("statusPill");
    const recTimer=$("recTimer"), inputArea=$("inputArea");

    // Auto-resize
    msgInput.addEventListener("input", () => { msgInput.style.height="auto"; msgInput.style.height=Math.min(msgInput.scrollHeight,120)+"px"; });
    msgInput.addEventListener("keydown", e => { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendText()} });

    btnSend.addEventListener("click", sendText);
    btnMic.addEventListener("click", toggleRec);
    btnFinish.addEventListener("click", finish);
    btnReset.addEventListener("click", reset);

    // Login
    btnLogin.addEventListener("click", doLogin);
    emailInput.addEventListener("keydown", e => { if(e.key==="Enter") doLogin(); });

    async function doLogin() {
      const email = emailInput.value.trim();
      if(!email) return;
      btnLogin.disabled = true; btnLogin.textContent = "Entrando...";

      try {
        const r = await api("/api/auth", { email });
        creatorId = r.creator_id;

        if(r.has_active_session) {
          resumeTurns.textContent = r.turn_count;
          resumeModal.classList.remove("hidden");
          btnResume.onclick = () => startSession(r.session_id, true);
          btnNewSession.onclick = async () => {
            await api("/api/reset", { session_id: r.session_id });
            startSession(null, false);
          };
        } else {
          startSession(null, false);
        }
      } catch(e) { alert("Erro: " + e.message); }
      btnLogin.disabled = false; btnLogin.textContent = "Começar";
    }

    async function startSession(existingId, resume) {
      loginScreen.classList.add("hidden");
      chatScreen.classList.remove("hidden");
      chatScreen.style.display = "flex";
      showTyping();

      try {
        const r = await api("/api/start", { creator_id: creatorId, session_id: existingId, resume });
        sessionId = r.session_id;
        removeTyping();

        if(r.resumed && r.messages) {
          // Restore conversation
          for(const m of r.messages) addMsg(m.role === "assistant" ? "ai" : "user", m.content);
          updateStatus(r.turn);
        } else if(r.greeting) {
          addMsg("ai", r.greeting);
          updateStatus(r.turn);
        }
      } catch(e) {
        removeTyping();
        addMsg("ai", "Erro ao iniciar: " + e.message);
      }
    }

    // Chat
    async function sendText() {
      const text = msgInput.value.trim();
      if(!text || isWaiting) return;
      addMsg("user", text);
      msgInput.value = ""; msgInput.style.height = "auto";
      setWait(true); showTyping();

      try {
        const r = await api("/api/chat", { session_id: sessionId, message: text });
        removeTyping();
        if(r.response) addMsg("ai", r.response);
        if(r.finished) showDone();
        updateStatus(r.turn);
      } catch(e) { removeTyping(); addMsg("ai", "Erro. Tente novamente."); }
      setWait(false);
    }

    // Audio
    async function toggleRec() { isRecording ? stopRec() : startRec(); }

    async function startRec() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";
        mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if(e.data.size>0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => { stream.getTracks().forEach(t=>t.stop()); await sendAudio(new Blob(audioChunks,{type:mime})); };
        mediaRecorder.start(250);
        isRecording = true; btnMic.classList.add("recording");
        recStart = Date.now(); recTimer.classList.add("on"); updateRecTimer();
        recInterval = setInterval(updateRecTimer, 1000);
      } catch(e) { addMsg("ai", "Sem acesso ao microfone. Tente digitar."); }
    }

    function stopRec() {
      if(mediaRecorder?.state!=="inactive") mediaRecorder.stop();
      isRecording = false; btnMic.classList.remove("recording");
      clearInterval(recInterval); recTimer.classList.remove("on");
    }

    function updateRecTimer() {
      const s = Math.floor((Date.now()-recStart)/1000);
      recTimer.textContent = `● REC ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    }

    async function sendAudio(blob) {
      setWait(true); showTyping();
      const pm = addMsg("user", "🎤 Enviando áudio...", true);
      const fd = new FormData(); fd.append("audio", blob, "rec.webm"); fd.append("session_id", sessionId);

      try {
        const r = await fetch("/api/audio", { method: "POST", body: fd }).then(r=>r.json());
        removeTyping();
        if(r.error) { pm.remove(); addMsg("ai", r.error); setWait(false); return; }
        if(r.transcription) {
          pm.querySelector(".content").textContent = r.transcription;
          const n = document.createElement("div"); n.className="tnote"; n.textContent="🎤 transcrito";
          pm.querySelector(".content").parentNode.insertBefore(n, pm.querySelector(".content"));
        }
        if(r.response) addMsg("ai", r.response);
        if(r.finished) showDone();
        updateStatus(r.turn);
      } catch(e) { removeTyping(); pm.remove(); addMsg("ai", "Erro no áudio. Tente digitar."); }
      setWait(false);
    }

    // Finish / Reset
    async function finish() {
      if(!confirm("Encerrar e salvar o perfil?")) return;
      setWait(true); showTyping();
      try {
        const r = await api("/api/finish", { session_id: sessionId });
        removeTyping();
        if(r.response) addMsg("ai", r.response);
        if(r.finished) showDone();
      } catch(e) { removeTyping(); addMsg("ai", "Erro ao finalizar."); }
      setWait(false);
    }

    async function reset() {
      if(!confirm("Reiniciar? Dados da sessão atual serão abandonados.")) return;
      await api("/api/reset", { session_id: sessionId });
      chat.innerHTML = ""; inputArea.style.display = "";
      startSession(null, false);
    }

    // UI Helpers
    function addMsg(role, text, retEl=false) {
      const d = document.createElement("div"); d.className = `message ${role}`;
      const l = document.createElement("span"); l.className = "label"; l.textContent = role==="ai" ? "ViralSE" : "Você";
      const c = document.createElement("div"); c.className = "content"; c.textContent = text;
      d.appendChild(l); d.appendChild(c); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
      if(retEl) return d;
    }

    function showTyping() {
      if(document.querySelector(".typing")) return;
      const d = document.createElement("div"); d.className = "typing";
      d.innerHTML = "<span></span><span></span><span></span>"; chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    }
    function removeTyping() { document.querySelector(".typing")?.remove(); }

    function showDone() {
      const d = document.createElement("div"); d.className = "finished-banner";
      d.innerHTML = `✅ Perfil salvo!<br><br><a href="/resultado/${sessionId}" target="_blank">→ Ver resultado completo</a>`;
      chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
      inputArea.style.display = "none";
    }

    function setWait(v) { isWaiting=v; btnSend.disabled=v; btnMic.disabled=v; msgInput.disabled=v; }
    function updateStatus(t) { statusPill.textContent = `Turno ${t||0}`; }

    async function api(url, body) {
      const r = await fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error || "Erro");
      return d;
    }
  </script>
</body>
</html>
